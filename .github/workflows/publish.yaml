# Validate pull requests and main. On main pushes, publish a dev build derived from the committed
# version when its v<version> tag exists on origin, or verify an untagged committed RC/stable
# version without publication; publish RC/stable GitHub Releases. Publication runs gate on
# deployed live smoke tests.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.14.0", "22", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Validate locked source and installed package
        run: |
          npm ci
          npm run check
          npm run test:package

  publish:
    needs: validate
    if: >-
      github.repository == 'lambdadb/lambdadb-mcp' &&
      (github.event_name == 'release' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Never interrupt a registry write. New pending dev jobs replace older ones.
      group: npm-publication
      cancel-in-progress: false
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require an OIDC-capable npm
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); const v=execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) throw Error("npm >=11.5.1 required");'
      - name: Select the run mode
        id: mode
        run: node scripts/version.mjs mode
      - name: Prepare deterministic development version
        if: steps.mode.outputs.mode == 'dev'
        id: dev
        run: node scripts/dev-release.mjs prepare
      - name: Verify committed release metadata and main ancestry without publication
        if: steps.mode.outputs.mode == 'verify'
        run: node scripts/release.mjs verify
      - name: Verify explicit release metadata and main ancestry
        if: steps.mode.outputs.mode == 'release'
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node scripts/release.mjs prepare
      - name: Pack once and test the exact publication artifact
        if: steps.mode.outputs.mode != 'dev' || steps.dev.outputs.ready == 'true'
        id: package
        shell: bash
        run: |
          npm ci
          npm run check:version
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/package.json"
          MCP_TARBALL=$(node --input-type=module -e 'import fs from "node:fs"; const file=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/package.json","utf8"))[0].filename; console.log(`${process.env.RUNNER_TEMP}/${file}`);')
          npm run test:package -- "$MCP_TARBALL"
          echo "tarball=$MCP_TARBALL" >> "$GITHUB_OUTPUT"
      # Dev builds run every live suite against the dev environment; release verification and
      # RC/stable releases against production. A missing Variable stays empty and fails the run.
      - name: Authenticate smoke tests to AWS
        if: steps.mode.outputs.mode != 'dev' || steps.dev.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars[format('{0}SMOKE_AWS_ROLE_ARN', steps.mode.outputs.smoke_prefix)] }}
          aws-region: ap-northeast-2
          role-session-name: mcp-smoke-${{ github.run_id }}
      - name: Run deployed live smoke tests
        if: steps.mode.outputs.mode != 'dev' || steps.dev.outputs.ready == 'true'
        env:
          LAMBDADB_BASE_URL: ${{ vars[format('{0}BASE_URL', steps.mode.outputs.smoke_prefix)] }}
          LAMBDADB_PROJECT_NAME: ${{ vars[format('{0}PROJECT_NAME', steps.mode.outputs.smoke_prefix)] }}
          LAMBDADB_SMOKE_SECRET_ARN: ${{ vars[format('{0}SMOKE_SECRET_ARN', steps.mode.outputs.smoke_prefix)] }}
        run: |
          echo "Live smoke target: $LAMBDADB_BASE_URL"
          node scripts/run-live-smoke.mjs
      - name: Publish development version and verify registry state
        if: >-
          steps.mode.outputs.mode == 'dev' && steps.dev.outputs.ready == 'true' &&
          vars.NPM_DEV_PUBLISH_ENABLED == 'true'
        env:
          MCP_TARBALL: ${{ steps.package.outputs.tarball }}
        run: node scripts/dev-release.mjs publish
      - name: Publish explicit release using npm Trusted Publishing
        if: steps.mode.outputs.mode == 'release'
        env:
          MCP_TARBALL: ${{ steps.package.outputs.tarball }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release.mjs publish

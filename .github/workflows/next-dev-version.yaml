# After an RC/stable GitHub Release publishes, open a pull request that restores the
# X.Y.Z-dev.0 placeholder on main so dev builds resume above the released version.
name: Open next development version

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: next-dev-version
  cancel-in-progress: false

jobs:
  open-pull-request:
    if: >-
      github.repository == 'lambdadb/lambdadb-mcp' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Open the next development version pull request
        env:
          # For a release-triggered run, head_branch is the release tag.
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "Unexpected release tag $RELEASE_TAG" >&2
            exit 1
          fi
          RELEASED="${RELEASE_TAG#v}"
          CURRENT=$(node scripts/version.mjs get)
          if [ "$CURRENT" != "$RELEASED" ]; then
            echo "main is at $CURRENT, not the released $RELEASED; nothing to do"
            exit 0
          fi
          NEXT=$(node scripts/version.mjs next-dev "$RELEASED")
          BRANCH="chore/next-dev-$NEXT"
          MAIN=$(git rev-parse HEAD)
          OPEN=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq length)
          # Reruns are safe: keep an open pull request whose branch already contains main;
          # otherwise (partial earlier run, stale branch) recreate the branch from main.
          if [ "$OPEN" != 0 ] && git fetch --quiet origin "refs/heads/$BRANCH" &&
              git merge-base --is-ancestor "$MAIN" FETCH_HEAD; then
            echo "$BRANCH has an open pull request based on the current main; nothing to do"
            exit 0
          fi
          node scripts/version.mjs set "$NEXT"
          git switch -C "$BRANCH"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "chore: start $NEXT development"
          git push --force origin "$BRANCH"
          if [ "$OPEN" = 0 ]; then
            gh pr create --base main --head "$BRANCH" --title "chore: start $NEXT development" --body \
              "$RELEASE_TAG is published. This restores the development placeholder so dev builds resume as \`${NEXT%.0}.N\`, above the released version. Change the version with \`node scripts/version.mjs set X.Y.Z-dev.0\` if the next release is a minor or major version. Pull requests opened by GitHub Actions do not trigger CI; run the CI workflow on this branch manually for checks before merging, and the main push runs the full checks when this merges."
          fi
